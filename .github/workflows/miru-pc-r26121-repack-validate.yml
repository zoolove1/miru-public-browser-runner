name: MIRU PC R2.6.12.1 Recovery Repack Validation

on:
  push:
    branches:
      - control/miru-pc-r2612-build-20260729
    paths:
      - '.github/workflows/miru-pc-r26121-repack-validate.yml'
      - 'tools/repack_miru_pc_r26121_recovery.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/miru-pc-r26121-repack-validate.yml'
      - 'tools/repack_miru_pc_r26121_recovery.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: miru-pc-r26121-repack-validation
  cancel-in-progress: true

jobs:
  repack:
    if: github.actor == 'zoolove1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: autonomy-system
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
      BASE_OBJECT: gs://autonomy-system-miru-build-artifacts/miru-pc/r2612/b59d0d09-4742-46ef-9174-5a0b3d6126f7/MIRU_PC_R2.6.12_STANDALONE_FINAL.zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Download verified base and repack recovery ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gcloud storage cp "${BASE_OBJECT}" evidence/base-r2612.zip
          python tools/repack_miru_pc_r26121_recovery.py \
            evidence/base-r2612.zip \
            evidence/MIRU_PC_R2.6.12.1_RECOVERY_WINDOWS_VERIFIED.zip
          sha256sum --check evidence/MIRU_PC_R2.6.12.1_RECOVERY_WINDOWS_VERIFIED.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: miru-pc-r26121-recovery-repack-${{ github.run_id }}
          path: |
            evidence/MIRU_PC_R2.6.12.1_RECOVERY_WINDOWS_VERIFIED.zip
            evidence/MIRU_PC_R2.6.12.1_RECOVERY_WINDOWS_VERIFIED.zip.sha256
          if-no-files-found: error
          retention-days: 7

  windows-e2e:
    needs: repack
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: miru-pc-r26121-recovery-repack-${{ github.run_id }}
          path: evidence
      - name: Validate exact final recovery ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $zip = Join-Path $env:GITHUB_WORKSPACE 'evidence\MIRU_PC_R2.6.12.1_RECOVERY_WINDOWS_VERIFIED.zip'
          $extract = Join-Path $env:GITHUB_WORKSPACE 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $patchRoot = Get-ChildItem -LiteralPath $extract -Directory -Recurse |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName '02_TEST_PATCH_STATIC.cmd') } |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($patchRoot)) { throw 'Patch root not found.' }

          $version = (Get-Content -Raw -LiteralPath (Join-Path $patchRoot 'VERSION.txt')).Trim()
          if ($version -ne '2.6.12.1') { throw "VERSION mismatch: $version" }
          $static = Get-Content -Raw -LiteralPath (Join-Path $patchRoot 'payload\scripts\Test-MiruPatchStatic.ps1')
          if (-not $static.Contains(".Trim()-ne '2.6.12.1'")) { throw 'Static version contract missing.' }
          if ($static.Contains(".Trim()-ne '2.6.12'")) { throw 'Legacy static version contract remains.' }

          foreach ($relative in @(
            'payload\scripts\Test-MiruPatchStatic.ps1',
            'payload\scripts\Test-MiruTerminationPropagation.ps1',
            'payload\scripts\Test-MiruInstallerRollback.ps1'
          )) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $patchRoot $relative) -PatchRoot $patchRoot
            if ($LASTEXITCODE -ne 0) { throw "Validation failed: $relative exit=$LASTEXITCODE" }
          }

          $policy = Get-Content -Raw -LiteralPath (Join-Path $patchRoot 'payload\config\miru-stable-policy.json') | ConvertFrom-Json
          if ([string]$policy.patch_version -ne '2.6.12.1') { throw 'Policy version mismatch.' }
          if ([string]$policy.core_stack_version -ne '0.9.9.2') { throw 'Core version mismatch.' }

          $relay = Get-Content -Raw -LiteralPath (Join-Path $patchRoot 'payload\root\Start-MiruContinuousSlidesRelay.ps1')
          foreach ($required in @('TargetIntervalMilliseconds = 200', "ImageFormat = 'PNG'", 'SINGLE_IN_FLIGHT_NO_QUEUE', 'original_resolution = $true', 'resampling = $false')) {
            if (-not $relay.Contains($required)) { throw "Relay contract missing: $required" }
          }
          $start = Get-Content -Raw -LiteralPath (Join-Path $patchRoot 'payload\scripts\Start-MiruStableMode.ps1')
          $supervisor = Get-Content -Raw -LiteralPath (Join-Path $patchRoot 'payload\scripts\Miru-OverlaySupervisor.ps1')
          if (-not $start.Contains('STATE_SCHEMA_COMPATIBILITY_R26121')) { throw 'State migration missing.' }
          if (-not $supervisor.Contains('PRESERVE_CORE_STATE_SCHEMA_R26121')) { throw 'State preservation missing.' }

          Write-Host 'MIRU_PC_R26121_RECOVERY_REPACK_WINDOWS_E2E=PASS'
