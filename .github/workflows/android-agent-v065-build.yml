name: Android Broker Control Signal v0.7.0 Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-agent-v065-build.yml'
      - 'control/android-v065-build-commit.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-broker-control-signal-v070-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.actor == 'zoolove1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'control/android-broker-v070-cloud-build'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: autonomy-system
      REGION: us-central1
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
      BUILD_SERVICE_ACCOUNT: projects/autonomy-system/serviceAccounts/770537155218-compute@developer.gserviceaccount.com
      CONNECTED_REPOSITORY: projects/autonomy-system/locations/us-central1/connections/miru-private-github/repositories/useful-orbit-automation
      PRIVATE_BRANCH: agent/android-signal-broker-v070-safe
      BUILD_CONFIG: cloudbuild/android-broker-control-signal-v070.yaml
      TRIGGER_NAME: android-broker-control-signal-v070
      ARTIFACT_BUCKET: gs://autonomy-system-miru-build-artifacts

    steps:
      - name: Check out isolated public control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact private commit marker
        shell: bash
        run: |
          set -euo pipefail
          private_commit="$(tr -d '\r\n[:space:]' < control/android-v065-build-commit.txt)"
          [[ "${private_commit}" =~ ^[0-9a-f]{40}$ ]]
          echo "PRIVATE_COMMIT=${private_commit}" >> "${GITHUB_ENV}"

      - name: Obtain short-lived Google credentials through WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Create or reuse bounded broker deployment trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if ! gcloud builds triggers describe "${TRIGGER_NAME}" --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            gcloud builds triggers create manual \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --name="${TRIGGER_NAME}" \
              --repository="${CONNECTED_REPOSITORY}" \
              --branch="${PRIVATE_BRANCH}" \
              --build-config="${BUILD_CONFIG}" \
              --service-account="${BUILD_SERVICE_ACCOUNT}" \
              --no-require-approval
          fi
          gcloud builds triggers describe "${TRIGGER_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/trigger.json

      - name: Run exact private commit and wait
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds triggers run "${TRIGGER_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --sha="${PRIVATE_COMMIT}" \
            --quiet \
            --format=json > evidence/trigger-run.json 2> evidence/trigger-run.stderr

          BUILD_ID="$(jq -r '.metadata.build.id // .metadata.buildId // .id // empty' evidence/trigger-run.json)"
          test -n "${BUILD_ID}"
          echo "BUILD_ID=${BUILD_ID}" >> "${GITHUB_ENV}"

          status='UNKNOWN'
          for _ in $(seq 1 210); do
            status="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status)')"
            case "${status}" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
            esac
            sleep 10
          done

          gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/build.json
          gcloud builds log "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" > evidence/cloudbuild.log 2>&1 || true
          jq -n --arg status "${status}" --arg buildId "${BUILD_ID}" --arg commit "${PRIVATE_COMMIT}" \
            '{status:$status,buildId:$buildId,commit:$commit}' > evidence/control-result.json

          prefix="${ARTIFACT_BUCKET}/android-broker/v0.7.0-signal/${BUILD_ID}"
          for file in deploy-result.json validation.log javascript-syntax.log combined-source.sha256 deploy.stdout deploy.stderr deploy.rc backup-result.json; do
            gcloud storage cp "${prefix}/${file}" "evidence/${file}" || true
          done

          test "${status}" = 'SUCCESS'
          test -s evidence/deploy-result.json
          grep -F 'ANDROID_CONTROL_SIGNAL_V070_STATIC_VALIDATION_OK' evidence/validation.log
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('evidence/deploy-result.json').read_text())
          assert value.get('ok') is True, value
          assert value.get('status') == 'ANDROID_CONTROL_SIGNAL_V070_DEPLOYED_AND_WAIT_POLL_PASSED', value
          assert value.get('webAppUrlPreserved') is True, value
          assert value.get('deviceKeyPreserved') is True, value
          health = value.get('health') or {}
          assert health.get('explicitUserStopVersion') == '0.6.4', health
          assert health.get('controlSignalReady') is True, health
          assert health.get('controlSignalProtocolVersion') == '0.7.0', health
          assert health.get('controlSignalActions') == ['EXECUTE', 'WAIT', 'STOP'], health
          poll = value.get('controlPoll') or {}
          assert poll.get('status') == 'ANDROID_CONTROL_SIGNAL', poll
          assert poll.get('action') == 'WAIT', poll
          assert poll.get('consumedTo') is None, poll
          print('ANDROID_CONTROL_SIGNAL_V070_PUBLIC_RELAY_VERIFIED')
          PY

      - name: Upload sanitized deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-broker-control-signal-v070-${{ github.run_id }}
          path: |
            evidence/control-result.json
            evidence/build.json
            evidence/cloudbuild.log
            evidence/deploy-result.json
            evidence/validation.log
            evidence/javascript-syntax.log
            evidence/combined-source.sha256
            evidence/deploy.stdout
            evidence/deploy.stderr
            evidence/deploy.rc
            evidence/backup-result.json
            evidence/trigger.json
            evidence/trigger-run.json
            evidence/trigger-run.stderr
          if-no-files-found: warn
          retention-days: 2
