name: Android Broker Device Key Encrypted Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-agent-v065-build.yml'
      - 'control/android-v065-build-commit.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-broker-device-key-encrypted-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.actor == 'zoolove1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'control/android-broker-v070-cloud-build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: autonomy-system
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
      SOURCE_BUILD_ID: 767a7488-b505-40b8-92ad-188aceb50098
      SOURCE_URI: gs://autonomy-system-miru-build-artifacts/android-broker/v0.7.0-signal/767a7488-b505-40b8-92ad-188aceb50098/before-content.json
      BROKER_URL: https://script.google.com/macros/s/AKfycbxUD2uI5jrD_IHJSnEmf23Gf37BhaY09aPcxAtIp4H__8C_QKKfUZ_NpR5mi0ZVH--O/exec
      PUBLIC_KEY_B64: 

    steps:
      - name: Check out isolated recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Obtain short-lived Google credentials through WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Recover and encrypt device key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p recovery
          gcloud storage cp "${SOURCE_URI}" recovery/before-content.json >/dev/null
          printf '%s' "${PUBLIC_KEY_B64}" | base64 --decode > recovery/public.pem

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          value = json.loads(Path('recovery/before-content.json').read_text(encoding='utf-8'))
          content = value.get('content') or {}
          files = content.get('files') or []
          source = ''
          for item in files:
              if isinstance(item, dict) and item.get('name') == 'Code' and item.get('type') == 'SERVER_JS':
                  source = str(item.get('source') or '')
                  break
          if not source:
              raise SystemExit('REMOTE_CODE_FILE_MISSING')
          match = re.search(r'const ANDROID_BROWSER_DEVICE_KEY_V010 = ("(?:\\.|[^"])*");', source)
          if not match:
              raise SystemExit('REMOTE_DEVICE_KEY_MISSING')
          key = json.loads(match.group(1))
          if not isinstance(key, str) or len(key) < 16 or len(key.encode('utf-8')) > 300:
              raise SystemExit('REMOTE_DEVICE_KEY_INVALID')
          Path('recovery/device-key.txt').write_text(key, encoding='utf-8')
          Path('recovery/recovery-metadata.json').write_text(json.dumps({
              'schemaVersion': '1.0.0',
              'sourceBuildId': '767a7488-b505-40b8-92ad-188aceb50098',
              'brokerUrl': 'https://script.google.com/macros/s/AKfycbxUD2uI5jrD_IHJSnEmf23Gf37BhaY09aPcxAtIp4H__8C_QKKfUZ_NpR5mi0ZVH--O/exec',
              'keyLength': len(key),
              'plaintextUploaded': False,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          openssl pkeyutl -encrypt \
            -pubin \
            -inkey recovery/public.pem \
            -in recovery/device-key.txt \
            -out recovery/device-key.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum recovery/device-key.enc > recovery/device-key.enc.sha256
          test -s recovery/device-key.enc
          rm -f recovery/device-key.txt recovery/before-content.json recovery/public.pem
          test ! -e recovery/device-key.txt
          test ! -e recovery/before-content.json

      - name: Upload encrypted recovery only
        uses: actions/upload-artifact@v4
        with:
          name: android-broker-device-key-encrypted-${{ github.run_id }}
          path: |
            recovery/device-key.enc
            recovery/device-key.enc.sha256
            recovery/recovery-metadata.json
          if-no-files-found: error
          retention-days: 1
