name: MIRU Screen Capture Canary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/miru-screen-capture-canary.yml'

jobs:
  capture:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Capture primary screen
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          try {
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $path = Join-Path $env:RUNNER_TEMP 'miru-current-screen.png'
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            [ordered]@{
              captured_at = (Get-Date).ToString('o')
              x = $bounds.X
              y = $bounds.Y
              width = $bounds.Width
              height = $bounds.Height
              path = $path
            } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'miru-screen-meta.json') -Encoding UTF8
          } finally {
            $g.Dispose()
            $bmp.Dispose()
          }
      - name: Upload screen
        uses: actions/upload-artifact@v4
        with:
          name: miru-current-screen
          path: |
            ${{ runner.temp }}/miru-current-screen.png
            ${{ runner.temp }}/miru-screen-meta.json
          retention-days: 1
