name: MIRU PC R2.6.12 Failed Build Diagnostics

on:
  push:
    branches:
      - control/miru-pc-r2612-build-20260729
    paths:
      - '.github/workflows/miru-pc-r2612-diagnose.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/miru-pc-r2612-diagnose.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.actor == 'zoolove1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: autonomy-system
      REGION: us-central1
      BUILD_ID: b88679bf-ae12-4ad6-876b-b95b106ea91b
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Collect exact failed build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/build.json
          gcloud builds log "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" > evidence/cloudbuild.log 2>&1 || true
          gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status)' > evidence/status.txt
          echo '--- CLOUD BUILD STATUS ---'
          cat evidence/status.txt
          echo '--- CLOUD BUILD LOG ---'
          cat evidence/cloudbuild.log
      - uses: actions/upload-artifact@v4
        with:
          name: miru-pc-r2612-failed-build-${{ env.BUILD_ID }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
