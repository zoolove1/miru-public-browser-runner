name: Signal Agent v1.0.7 Read-only Diagnostic Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/signal-agent-v106-build.yml'
      - 'control/signal-agent-v106-commit.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: signal-agent-v107-diagnostic-build
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.actor == 'zoolove1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'control/signal-agent-v106-build'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROJECT_ID: autonomy-system
      REGION: us-central1
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
      BUILD_SERVICE_ACCOUNT: projects/autonomy-system/serviceAccounts/770537155218-compute@developer.gserviceaccount.com
      CONNECTED_REPOSITORY: projects/autonomy-system/locations/us-central1/connections/miru-private-github/repositories/useful-orbit-automation
      PRIVATE_BRANCH: agent/signal-v107-readonly-diagnostic
      BUILD_CONFIG: cloudbuild/signal-v107-readonly-diagnostic.yaml
      TRIGGER_NAME: signal-v107-readonly-diagnostic
      ARTIFACT_BUCKET: gs://autonomy-system-miru-build-artifacts

    steps:
      - name: Check out isolated public control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact private commit marker
        shell: bash
        run: |
          set -euo pipefail
          private_commit="$(tr -d '\r\n[:space:]' < control/signal-agent-v106-commit.txt)"
          [[ "${private_commit}" =~ ^[0-9a-f]{40}$ ]]
          echo "PRIVATE_COMMIT=${private_commit}" >> "${GITHUB_ENV}"

      - name: Obtain short-lived Google credentials through WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Create bounded diagnostic trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence output
          if ! gcloud builds triggers describe "${TRIGGER_NAME}" --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            gcloud builds triggers create manual \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --name="${TRIGGER_NAME}" \
              --repository="${CONNECTED_REPOSITORY}" \
              --branch="${PRIVATE_BRANCH}" \
              --build-config="${BUILD_CONFIG}" \
              --service-account="${BUILD_SERVICE_ACCOUNT}" \
              --no-require-approval
          fi
          gcloud builds triggers describe "${TRIGGER_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/trigger.json
          jq -e --arg branch "refs/heads/${PRIVATE_BRANCH}" '.gitFileSource.revision == $branch and .sourceToBuild.ref == $branch' evidence/trigger.json
          jq -e --arg config "${BUILD_CONFIG}" '.gitFileSource.path == $config' evidence/trigger.json

      - name: Run exact diagnostic source commit and wait
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds triggers run "${TRIGGER_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --sha="${PRIVATE_COMMIT}" \
            --quiet \
            --format=json > evidence/trigger-run.json 2> evidence/trigger-run.stderr

          BUILD_ID="$(jq -r '.metadata.build.id // .metadata.buildId // .id // empty' evidence/trigger-run.json)"
          test -n "${BUILD_ID}"
          echo "BUILD_ID=${BUILD_ID}" >> "${GITHUB_ENV}"
          status='UNKNOWN'
          for _ in $(seq 1 270); do
            status="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status)')"
            case "${status}" in SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;; esac
            sleep 10
          done

          gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/build.json
          gcloud builds log "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" > evidence/cloudbuild.log 2>&1 || true
          jq -n --arg status "${status}" --arg buildId "${BUILD_ID}" --arg commit "${PRIVATE_COMMIT}" \
            '{status:$status,buildId:$buildId,commit:$commit}' > evidence/control-result.json

          prefix="${ARTIFACT_BUCKET}/android-agent/signal-v107-readonly-diagnostic/${BUILD_ID}"
          gcloud storage cp "${prefix}/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk" output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk
          gcloud storage cp "${prefix}/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk.sha256" output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk.sha256
          gcloud storage cp "${prefix}/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1-source.tar.gz" output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1-source.tar.gz
          gcloud storage cp "${prefix}/diagnostic-build.log" evidence/diagnostic-build.log
          gcloud storage cp "${prefix}/diagnostic-signature.txt" evidence/diagnostic-signature.txt

          test "${status}" = 'SUCCESS'
          test -s output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk
          expected_hash="$(awk '{print $1}' output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk.sha256)"
          actual_hash="$(sha256sum output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk | awk '{print $1}')"
          test "${actual_hash}" = "${expected_hash}"
          grep -F 'BUILD SUCCESSFUL' evidence/diagnostic-build.log
          grep -F 'Signer #1 certificate SHA-256 digest: aee59b74a81327b07e0eea7f76831da317f9aed334a9448ce4306d2c0925d0e5' evidence/diagnostic-signature.txt

      - name: Upload read-only diagnostic and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: signal-agent-v107-diagnostic-${{ github.run_id }}
          path: |
            output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk
            output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1.apk.sha256
            output/UsefulOrbit-ChatGPT-Diagnostic-v1.0.7-diag1-source.tar.gz
            evidence/control-result.json
            evidence/build.json
            evidence/cloudbuild.log
            evidence/diagnostic-build.log
            evidence/diagnostic-signature.txt
            evidence/trigger.json
            evidence/trigger-run.json
            evidence/trigger-run.stderr
          if-no-files-found: warn
          retention-days: 2
