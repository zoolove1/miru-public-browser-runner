name: Apps Script ADC Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/cloud-build-revalidation-v010.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: apps-script-adc-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.actor == 'zoolove1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/cloud-build-revalidation-v010'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_ID: autonomy-system
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
      SCRIPT_ID: 19TfGZdvI0d8I8mwzsdHW1bWt6WGXuTdyMbSv8K8qoguz0HFp0oMiQ_F7

    steps:
      - name: Check out control branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Obtain short-lived Google credentials through WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Cloud Build runtime ADC can read Apps Script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > /tmp/apps-script-adc-preflight.yaml <<'EOF'
          steps:
            - name: 'gcr.io/cloud-builders/gcloud'
              entrypoint: 'bash'
              args:
                - '-ceu'
                - |
                  TOKEN="$$(gcloud auth print-access-token)"
                  curl -fsS -H "Authorization: Bearer $${TOKEN}" \
                    "https://script.googleapis.com/v1/projects/${_SCRIPT_ID}/content" \
                    > /tmp/content.json
                  curl -fsS -H "Authorization: Bearer $${TOKEN}" \
                    "https://script.googleapis.com/v1/projects/${_SCRIPT_ID}/deployments" \
                    > /tmp/deployments.json
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  content = json.loads(Path('/tmp/content.json').read_text())
                  deployments = json.loads(Path('/tmp/deployments.json').read_text())
                  files = content.get('files', [])
                  assert files, 'NO_SCRIPT_FILES'
                  assert any(f.get('type') == 'JSON' and f.get('name') == 'appsscript' for f in files), 'MANIFEST_NOT_FOUND'
                  print('APPS_SCRIPT_ADC_PREFLIGHT_OK')
                  print(f"FILE_COUNT={len(files)}")
                  print(f"DEPLOYMENT_COUNT={len(deployments.get('deployments', []))}")
                  PY
          substitutions:
            _SCRIPT_ID: '19TfGZdvI0d8I8mwzsdHW1bWt6WGXuTdyMbSv8K8qoguz0HFp0oMiQ_F7'
          serviceAccount: 'projects/autonomy-system/serviceAccounts/770537155218-compute@developer.gserviceaccount.com'
          options:
            logging: CLOUD_LOGGING_ONLY
          timeout: '180s'
          EOF

          set +e
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --no-source \
            --config=/tmp/apps-script-adc-preflight.yaml \
            --async \
            --format=json \
            > evidence/submit.json \
            2> evidence/submit.stderr
          submit_rc=$?
          set -e
          printf '%s\n' "${submit_rc}" > evidence/submit.rc
          cat evidence/submit.stderr >&2 || true
          test "${submit_rc}" -eq 0

          BUILD_ID="$(jq -r '.id // empty' evidence/submit.json)"
          test -n "${BUILD_ID}"
          status='UNKNOWN'
          for _ in $(seq 1 60); do
            status="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            case "${status}" in SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;; esac
            sleep 5
          done
          gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format=json > evidence/build.json
          gcloud builds log "${BUILD_ID}" --project="${PROJECT_ID}" > evidence/cloudbuild.log 2>&1 || true
          jq -n --arg status "${status}" --arg buildId "${BUILD_ID}" --arg scriptId "${SCRIPT_ID}" '{status:$status,buildId:$buildId,scriptId:$scriptId}' > evidence/summary.json
          cat evidence/cloudbuild.log
          test "${status}" = 'SUCCESS'

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-adc-preflight-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 1
