name: Android Agent v0.6.4 Explicit User Stop Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/android-agent-v064-build.yml'
      - 'control/android-v064-build-commit.txt'

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-agent-v064-explicit-user-stop-build
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.actor == 'zoolove1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'control/android-sol-v064-cloud-build'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PROJECT_ID: autonomy-system
      REGION: us-central1
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
      BUILD_SERVICE_ACCOUNT: projects/autonomy-system/serviceAccounts/770537155218-compute@developer.gserviceaccount.com
      CONNECTED_REPOSITORY: projects/autonomy-system/locations/us-central1/connections/miru-private-github/repositories/useful-orbit-automation
      PRIVATE_BRANCH: agent/android-sol-explicit-user-stop-v0.6.4
      BUILD_CONFIG: cloudbuild/android-agent-v064-explicit-user-stop.yaml
      TRIGGER_NAME: android-agent-v064-explicit-user-stop
      ARTIFACT_BUCKET: gs://autonomy-system-miru-build-artifacts

    steps:
      - name: Check out isolated public control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact private commit marker
        shell: bash
        run: |
          set -euo pipefail
          private_commit="$(tr -d '\r\n[:space:]' < control/android-v064-build-commit.txt)"
          [[ "${private_commit}" =~ ^[0-9a-f]{40}$ ]]
          echo "PRIVATE_COMMIT=${private_commit}" >> "${GITHUB_ENV}"

      - name: Obtain short-lived Google credentials through WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Create or reuse bounded Android v0.6.4 build trigger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence output
          if ! gcloud builds triggers describe "${TRIGGER_NAME}" --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            gcloud builds triggers create manual \
              --project="${PROJECT_ID}" --region="${REGION}" --name="${TRIGGER_NAME}" \
              --repository="${CONNECTED_REPOSITORY}" --branch="${PRIVATE_BRANCH}" \
              --build-config="${BUILD_CONFIG}" --service-account="${BUILD_SERVICE_ACCOUNT}" \
              --no-require-approval
          fi
          gcloud builds triggers describe "${TRIGGER_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/trigger.json

      - name: Run exact private commit and wait
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds triggers run "${TRIGGER_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" --sha="${PRIVATE_COMMIT}" \
            --quiet --format=json > evidence/trigger-run.json 2> evidence/trigger-run.stderr
          BUILD_ID="$(jq -r '.metadata.build.id // .metadata.buildId // .id // empty' evidence/trigger-run.json)"
          test -n "${BUILD_ID}"
          echo "BUILD_ID=${BUILD_ID}" >> "${GITHUB_ENV}"
          status='UNKNOWN'
          for _ in $(seq 1 240); do
            status="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status)')"
            case "${status}" in SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;; esac
            sleep 10
          done
          gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > evidence/build.json
          gcloud builds log "${BUILD_ID}" --project="${PROJECT_ID}" --region="${REGION}" > evidence/cloudbuild.log 2>&1 || true
          jq -n --arg status "${status}" --arg buildId "${BUILD_ID}" --arg commit "${PRIVATE_COMMIT}" '{status:$status,buildId:$buildId,commit:$commit}' > evidence/control-result.json

          prefix="${ARTIFACT_BUCKET}/android-agent/v0.6.4-explicit-user-stop/${BUILD_ID}"
          gcloud storage cp "${prefix}/UsefulOrbit-Android-Agent-v0.6.4.apk" output/UsefulOrbit-Android-Agent-v0.6.4.apk
          gcloud storage cp "${prefix}/UsefulOrbit-Android-Agent-v0.6.4.apk.sha256" output/UsefulOrbit-Android-Agent-v0.6.4.apk.sha256
          for file in v062-base-patch.log v062-successor-validation.log v062-identity-validation.log v062-contract-validation.log v063-preflight-patch.log v063-preflight-validation.log v064-stop-patch.log v064-stop-validation.log android-build.log apk-signature.txt; do
            gcloud storage cp "${prefix}/${file}" "evidence/${file}"
          done

          test "${status}" = 'SUCCESS'
          expected_hash="$(awk '{print $1}' output/UsefulOrbit-Android-Agent-v0.6.4.apk.sha256)"
          actual_hash="$(sha256sum output/UsefulOrbit-Android-Agent-v0.6.4.apk | awk '{print $1}')"
          test "${actual_hash}" = "${expected_hash}"
          grep -F 'ANDROID_SOL_EXPLICIT_USER_STOP_V064_PATCH_OK' evidence/v064-stop-patch.log
          grep -F 'ANDROID_SOL_EXPLICIT_USER_STOP_V064_VALIDATION_OK' evidence/v064-stop-validation.log
          grep -F 'BUILD SUCCESSFUL' evidence/android-build.log
          grep -F 'Signer #1 certificate SHA-256 digest: aee59b74a81327b07e0eea7f76831da317f9aed334a9448ce4306d2c0925d0e5' evidence/apk-signature.txt

      - name: Upload signed APK and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-v064-explicit-user-stop-${{ github.run_id }}
          path: |
            output/UsefulOrbit-Android-Agent-v0.6.4.apk
            output/UsefulOrbit-Android-Agent-v0.6.4.apk.sha256
            evidence/
          if-no-files-found: warn
          retention-days: 2
