name: Blogger Connection Preflight 20260730

on:
  pull_request:
    paths:
      - ".github/workflows/blogger-connection-preflight-20260730.yml"

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: autonomy-system
      PROJECT_NUMBER: "770537155218"
      SECRET_NAME: CLASPRC_JSON
      WIF_PROVIDER: projects/770537155218/locations/global/workloadIdentityPools/miru-github/providers/miru-public-runner
      WIF_SERVICE_ACCOUNT: miru-cloud-build@autonomy-system.iam.gserviceaccount.com
    steps:
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run sanitized connection preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          default_sa="$(gcloud builds get-default-service-account --project="${PROJECT_ID}" 2>/dev/null || true)"
          if [[ -z "${default_sa}" ]]; then
            default_sa="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi

          api_state="UNKNOWN"
          if gcloud services list --enabled --project="${PROJECT_ID}" \
            --filter='config.name=blogger.googleapis.com' \
            --format='value(config.name)' 2>/dev/null | grep -qx 'blogger.googleapis.com'; then
            api_state="ENABLED"
          fi

          describe_state="UNKNOWN"
          if gcloud secrets describe "${SECRET_NAME}" --project="${PROJECT_ID}" >/dev/null 2>evidence/describe.err; then
            describe_state="EXISTS_AND_METADATA_READABLE"
          elif grep -qi 'NOT_FOUND' evidence/describe.err; then
            describe_state="NOT_FOUND"
          elif grep -qiE 'PERMISSION_DENIED|does not have permission' evidence/describe.err; then
            describe_state="METADATA_PERMISSION_DENIED"
          else
            describe_state="DESCRIBE_FAILED_OTHER"
          fi

          access_state="UNKNOWN"
          if gcloud secrets versions access latest --secret="${SECRET_NAME}" --project="${PROJECT_ID}" >/dev/null 2>evidence/access.err; then
            access_state="ACCESS_GRANTED"
          elif grep -qi 'NOT_FOUND' evidence/access.err; then
            access_state="NOT_FOUND_OR_NO_VERSION"
          elif grep -qiE 'PERMISSION_DENIED|secretmanager.versions.access|does not have permission' evidence/access.err; then
            access_state="ACCESS_PERMISSION_DENIED"
          else
            access_state="ACCESS_FAILED_OTHER"
          fi

          cat > evidence/cloudbuild-secret-probe.yaml <<'YAML'
          steps:
            - name: gcr.io/cloud-builders/gcloud
              entrypoint: bash
              secretEnv:
                - CLASPRC_JSON
              args:
                - -c
                - test -n "$$CLASPRC_JSON"
          availableSecrets:
            secretManager:
              - versionName: projects/770537155218/secrets/CLASPRC_JSON/versions/latest
                env: CLASPRC_JSON
          options:
            logging: CLOUD_LOGGING_ONLY
          timeout: 120s
          YAML

          cloud_build_secret_state="UNKNOWN"
          build_id=""
          if build_id="$(gcloud builds submit --no-source --async \
              --project="${PROJECT_ID}" \
              --config=evidence/cloudbuild-secret-probe.yaml \
              --format='value(id)' 2>evidence/build-submit.err)" && [[ -n "${build_id}" ]]; then
            for _ in $(seq 1 40); do
              build_status="$(gcloud builds describe "${build_id}" --project="${PROJECT_ID}" --format='value(status)' 2>/dev/null || true)"
              case "${build_status}" in
                SUCCESS)
                  cloud_build_secret_state="ACCESS_GRANTED"
                  break
                  ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                  cloud_build_secret_state="ACCESS_DENIED_OR_BUILD_FAILED"
                  break
                  ;;
              esac
              sleep 3
            done
            if [[ "${cloud_build_secret_state}" == "UNKNOWN" ]]; then
              cloud_build_secret_state="PROBE_TIMEOUT"
            fi
          else
            if grep -qiE 'PERMISSION_DENIED|secretmanager.versions.access|does not have permission' evidence/build-submit.err; then
              cloud_build_secret_state="ACCESS_PERMISSION_DENIED_AT_SUBMIT"
            elif grep -qi 'NOT_FOUND' evidence/build-submit.err; then
              cloud_build_secret_state="SECRET_NOT_FOUND_AT_SUBMIT"
            else
              cloud_build_secret_state="BUILD_SUBMIT_FAILED_OTHER"
            fi
          fi

          export default_sa api_state describe_state access_state cloud_build_secret_state build_id
          python3 - <<'PY'
          import json, os
          result = {
              "projectId": os.environ["PROJECT_ID"],
              "projectNumber": os.environ["PROJECT_NUMBER"],
              "bloggerApi": os.environ["api_state"],
              "wifServiceAccount": os.environ["WIF_SERVICE_ACCOUNT"],
              "defaultCloudBuildServiceAccount": os.environ["default_sa"],
              "secretName": os.environ["SECRET_NAME"],
              "secretMetadataFromWif": os.environ["describe_state"],
              "secretPayloadAccessFromWifServiceAccount": os.environ["access_state"],
              "secretPayloadAccessFromDefaultCloudBuildServiceAccount": os.environ["cloud_build_secret_state"],
              "probeBuildId": os.environ["build_id"] or None,
              "secretPayloadWasPrinted": False,
              "externalEffects": False,
          }
          with open("evidence/result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: blogger-connection-preflight-${{ github.run_id }}
          path: evidence/result.json
          if-no-files-found: error
          retention-days: 7
